<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="3.8">
<title>西門龍門儀錶板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --ink-2:#475569; --ink-3:#94a3b8;
  --line:#e2e8f0; --brand:#1d4ed8; --brand-soft:#eef2ff;
  --ok:#059669; --ok-soft:#ecfdf5; --warn:#d97706; --warn-soft:#fffbeb;
  --bad:#dc2626; --bad-soft:#fef2f2; --violet:#7c3aed; --violet-soft:#f5f3ff;
  --r:14px; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC",-apple-system,"Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.6; -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.hidden{display:none!important}


/* ---------- 頂部 ---------- */
header{
  position:sticky; top:0; z-index:50; background:#fff;
  border-bottom:1px solid var(--line);
}
.head-in{
  max-width:1040px; margin:0 auto; padding:10px 16px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo-mark{
  width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:16px;flex:0 0 auto;
}
.logo-mark svg{
  width:21px;height:21px;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.gate-box .logo-mark svg{width:32px;height:32px;stroke-width:1.7}
.logo h1{font-size:17px;margin:0;line-height:1.2}
.ver{font-size:11px;font-weight:500;color:var(--ink-3);background:#f1f5f9;border-radius:5px;padding:1px 6px;vertical-align:2px}
.ver.bad{background:var(--bad-soft);color:var(--bad)}
.logo p{margin:0;font-size:12px;color:var(--ink-3)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--line)}

.btn{
  border:1px solid var(--line); background:#fff; border-radius:10px;
  padding:9px 14px; font-weight:500; cursor:pointer; white-space:nowrap;
  transition:.15s; display:inline-flex; align-items:center; gap:6px; text-decoration:none;
}
.btn:hover{background:#f8fafc}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:#1a44bd}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-ok:hover{background:#047857}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2);padding:8px 10px}
.btn-ghost:hover{background:#f1f5f9}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn-danger{color:var(--bad);border-color:#fecaca;background:#fff}
.btn-danger:hover{background:var(--bad-soft)}
.btn-danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-danger-solid:hover{background:#b91c1c}

/* ---------- 版面 ---------- */
main{max-width:1040px;margin:0 auto;padding:16px 16px 80px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--brand);color:#fff}
.spacer{margin-left:auto}
.count-pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-2)}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card-top{display:flex;gap:10px;align-items:flex-start;padding:14px 16px 0}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.tag-order{background:var(--brand-soft);color:var(--brand)}
.tag-task{background:var(--violet-soft);color:var(--violet)}
.tag-routine{background:var(--warn-soft);color:var(--warn)}
.tag-stock{background:#e6f7f3;color:#0f766e}
.tag-scrap{background:#fee2e2;color:#b91c1c}
.tag-store{background:#f1f5f9;color:var(--ink-2);font-weight:500}
.tag-done{background:var(--ok-soft);color:var(--ok)}
.tag-cancel{background:#f1f5f9;color:var(--ink-3)}
.tag-alert{background:var(--bad-soft);color:var(--bad)}
.card-title{font-weight:700;font-size:16px;margin:0;flex:1 1 auto;min-width:0}
.card-body{padding:10px 16px 14px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 10px;font-size:14px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.items{margin:12px 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.items .it{display:flex;gap:8px;padding:8px 12px;font-size:14px;border-top:1px solid var(--line)}
.items .it:first-child{border-top:0}
.items .it b{font-weight:500;flex:1 1 auto}
.items .it .src{font-size:12px;color:var(--ink-3);background:#f1f5f9;border-radius:6px;padding:1px 8px;white-space:nowrap;align-self:center}
.items .sum{background:#f8fafc;font-weight:700;justify-content:flex-end;gap:14px}
.card-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#f8fafc;border-top:1px solid var(--line)}
.meta{font-size:12px;color:var(--ink-3);margin-right:auto}
.card.is-done{opacity:.72}
.note{background:var(--warn-soft);border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:8px 12px;font-size:13px;margin-top:10px}
.note.bad{background:var(--bad-soft);border-color:#fecaca;color:#991b1b}
.empty{text-align:center;color:var(--ink-3);padding:48px 16px;background:#fff;border:1px dashed var(--line);border-radius:var(--r)}

/* 修改紀錄（可收合） */
.chg{margin-top:10px;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.chg summary{cursor:pointer;color:var(--ink-3);list-style:none}
.chg summary::-webkit-details-marker{display:none}
.chg summary::before{content:'▸ ';}
.chg[open] summary::before{content:'▾ ';}
.chg>div{color:var(--ink-2);padding:5px 0 0 14px;word-break:break-word}

/* 確認視窗用 */
.pre{
  background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  font-family:inherit;font-size:13.5px;line-height:1.7;white-space:pre-wrap;
  margin:0 0 12px;max-height:40vh;overflow:auto;
}
.warehouse-alert{
  margin-top:8px;background:var(--warn-soft);border:1px solid #fcd34d;border-left:4px solid var(--warn);
  border-radius:8px;padding:8px 11px;font-size:13px;font-weight:700;color:#92400e;line-height:1.6;
}
.warehouse-alert span{display:block;font-weight:400;font-size:12px;margin-top:2px}
.scrap-warn{
  margin-bottom:16px;background:#fff1f2;border:1px solid #fda4af;border-left:4px solid var(--bad);
  border-radius:10px;padding:11px 13px;font-size:14.5px;font-weight:700;color:#9f1239;line-height:1.6;
}
.scrap-warn span{display:block;font-weight:400;font-size:12.5px;color:#be123c;margin-top:3px}
.alert-box{
  background:var(--warn-soft);border:1px solid #fcd34d;border-left:4px solid var(--warn);
  border-radius:10px;padding:11px 13px;font-size:14px;color:#92400e;line-height:1.7;margin:0 0 12px;
}
.alert-box.big{
  background:#fff1f2;border-color:#fda4af;border-left-color:var(--bad);color:#9f1239;
  font-weight:700;font-size:15px;margin:0 0 12px;
}
.alert-box.big span{display:block;font-weight:400;font-size:13px;color:#be123c;margin-top:3px}
.warn-box{
  background:var(--bad-soft);border:1px solid #fecaca;color:#991b1b;
  border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.7;margin:0 0 4px;
}
.edit-hint{
  background:var(--brand-soft);color:var(--brand);border-radius:10px;
  padding:11px 13px;font-size:13px;line-height:1.7;margin-bottom:16px;
}
.sec-title{font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:.04em;margin:22px 0 10px}

/* ---------- 表單 ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.modal{align-items:center;padding:24px}}
.sheet{background:#fff;width:100%;max-width:620px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0}
@media(min-width:640px){.sheet{border-radius:18px}}
.sheet-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:10px}
.sheet-head h2{margin:0;font-size:17px;flex:1}
.sheet-body{padding:16px 18px}
.sheet-foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:10px}
.sheet-foot .btn{flex:1;justify-content:center;padding:12px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.field .req{color:var(--bad)}
input[type=text],input[type=tel],input[type=date],input[type=number],
input[type=email],input[type=search],input[type=time],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;
}
/* 高度統一：日期、數字、下拉的預設高度本來都不一樣 */
input[type=text],input[type=tel],input[type=date],input[type=number],
input[type=email],input[type=search],input[type=time],select{
  height:46px;line-height:1.4;
}
/* 數字框的上下小箭頭會把高度撐開，手機也用不到（有數字鍵盤） */
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
textarea{min-height:84px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:500}
.checks{display:grid;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer}
.check.on{border-color:var(--brand);background:var(--brand-soft)}
.check input{margin-top:4px;width:18px;height:18px;flex:0 0 auto;accent-color:var(--brand)}

/* 品項列 */
.item-row{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fbfcfe}
.item-row .r2{display:flex;gap:8px;margin-top:8px;align-items:flex-end}
.item-row .r2 .f{flex:1 1 0;min-width:0}
.item-row .r2 label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:4px}
.item-row .del{border:0;background:transparent;color:var(--bad);cursor:pointer;padding:10px}
.stockline{font-size:12px;color:var(--ink-3);margin-top:6px}
.stockline b{color:var(--ink-2);font-weight:500}
.stockline.short{color:var(--warn)}
.item-row .cat-tabs{
  display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;margin:0 0 2px;
  border-bottom:1px solid var(--line);scrollbar-width:thin;
}
.item-row .cat-tabs::-webkit-scrollbar{height:4px}
.item-row .cat-tabs::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.cat-tab{
  border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:6px 13px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--ink-2);
}
.cat-tab:hover{background:#f8fafc}
.cat-tab.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
.item-row .two{display:grid;gap:9px}
.item-row .two .f{min-width:0}
.item-row label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:4px}
.item-row select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.item-row select:disabled{background-color:#f8fafc;color:var(--ink-3)}
/* 備貨：一支產品一個群組，規格一次填 */
.group-box{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fbfcfe}
.group-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.group-n{font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:3px 9px}
.group-top .del{margin-left:auto}
.group-box .f>label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:4px}
.spec-list{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.spec-head,.spec-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid var(--line)}
.spec-head{border-top:0;background:#f8fafc;font-size:12px;color:var(--ink-3);padding:6px 10px}
.spec-row .nm,.spec-head span:first-child{flex:1 1 auto;min-width:0;font-size:14px;word-break:break-word}
.spec-row .sq,.spec-head .sq{width:56px;text-align:right;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:0 0 auto}
.spec-row .sq.zero{color:var(--ink-3)}
/* 數量／單價兩欄跟表頭對齊，寬度要一模一樣 */
.spec-head .qt{width:112px;text-align:center;flex:0 0 auto}
.spec-head .qt.pr{width:92px}
.spec-row .stp{flex:0 0 112px;width:112px}
.spec-row input.gp{flex:0 0 92px;width:92px;text-align:center;padding-left:6px;padding-right:6px}
.spec-row.has{background:var(--brand-soft)}
.spec-row.has .nm{font-weight:500}
/* 填的數量比現有庫存多：整列標紅，送出後會變負數 */
.spec-row.short{background:var(--bad-soft)}
.spec-row.short .sq{color:var(--bad);font-weight:700}
/* 規格表裡的「性質」列：填了數量的那一格底下才會出現，整列佔滿 */
.spec-list .gift-row{margin-top:0;border-top:1px solid var(--line);border-radius:0;
  border-left:0;border-right:0;border-bottom:0;border-style:solid;padding:6px 10px}
.spec-list .gift-row .gl{padding-left:2px}
.spec-list .gift-row select{flex:1 1 120px;height:38px;padding:4px 8px}
/* 數量欄：−／＋ 按鈕 */
.stp{display:inline-flex;align-items:stretch;width:100%}
.stp .sb{
  flex:0 0 auto;width:34px;height:46px;padding:0;border:1px solid var(--line);background:#fff;
  color:var(--ink-2);font-size:19px;font-weight:700;line-height:1;cursor:pointer;
  display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.stp .sb:first-child{border-radius:10px 0 0 10px}
.stp .sb:last-child{border-radius:0 10px 10px 0}
.stp .sb:hover{background:#f1f5f9}
.stp .sb:active{background:var(--brand);border-color:var(--brand);color:#fff}
/* flex-basis 用 0，數字框才會跟著欄位一起縮，不會把旁邊的單價／小計擠出去 */
.stp input{flex:1 1 0;min-width:0;width:0;text-align:center;border-radius:0;
  border-left:0;border-right:0;padding-left:2px;padding-right:2px}
.stp input:focus{outline-offset:-2px}
/* 手機：把空間讓給規格名稱，才不會一個字一行 */
@media(max-width:480px){
  .spec-head,.spec-row{gap:6px;padding:7px 8px}
  .spec-row .sq,.spec-head .sq{width:36px}
  .spec-head .qt{width:100px}
  .spec-head .qt.pr{width:70px}
  .spec-row .stp{flex:0 0 100px;width:100px}
  .spec-row input.gp{flex:0 0 70px;width:70px}
  .stp .sb{width:30px;font-size:17px}
}
.spec-empty{margin-top:10px;padding:14px 12px;border:1px dashed var(--line);border-radius:10px;
  font-size:13px;color:var(--ink-3);text-align:center;background:#fff}
.add-item{width:100%;justify-content:center;border-style:dashed;padding:11px}
.total-bar{display:flex;justify-content:space-between;align-items:center;background:var(--brand-soft);border-radius:10px;padding:11px 14px;font-weight:700;color:var(--brand);margin-top:4px}

/* ---------- 折扣 ---------- */
.disc-row{display:flex;align-items:center;gap:10px;margin-top:8px;padding:9px 12px;
  border:1px dashed var(--line);border-radius:10px;background:#fff}
.disc-row .dl{flex:1 1 auto;font-size:14px;font-weight:700;color:var(--ink-2);line-height:1.3}
.disc-row .dl i{display:block;font-style:normal;font-size:11.5px;font-weight:400;color:var(--ink-3);margin-top:2px}
.disc-row input{flex:0 0 108px;width:108px;text-align:right}
.disc-row .stp{flex:0 0 108px}
.total-bar.net{background:#ecfdf5;color:#047857;margin-top:8px}
.total-bar.net.has{background:#d1fae5;box-shadow:inset 0 0 0 1.5px #10b981}
.disc-line{margin-top:6px;padding:7px 10px;border-radius:8px;background:#fff7ed;
  border:1px solid #fed7aa;font-size:12.5px;color:#9a3412;font-variant-numeric:tabular-nums}
.disc-line b{color:#c2410c}


/* ---------- 模式切換 ---------- */
.mode-bar{border-top:1px solid var(--line);background:#fff}
.mode-in{max-width:1040px;margin:0 auto;padding:0 16px;display:flex;gap:4px}
.mode-tab{
  border:0;background:transparent;padding:13px 20px;font-size:15px;font-weight:700;
  color:var(--ink-3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;
}
.mode-tab:hover{color:var(--ink-2)}
.mode-tab.on{color:var(--brand);border-bottom-color:var(--brand)}

/* ---------- 銷售紀錄（POS 風格） ---------- */
.pos-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}
.pos-btn{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 16px;
  font-size:17px;font-weight:700;cursor:pointer;text-align:center;box-shadow:var(--shadow);
  transition:.15s;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:96px;
  justify-content:center;color:var(--ink);
}
.pos-btn:hover{border-color:var(--brand);transform:translateY(-1px)}
.pos-btn .ico{font-size:26px;line-height:1}
.pos-btn .sub{font-size:12px;font-weight:400;color:var(--ink-3)}
.pos-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.pos-btn.primary:hover{background:#1a44bd}
.pos-btn.primary .sub{color:#c7d6fb}
.pos-btn .badge{
  background:var(--bad);color:#fff;border-radius:999px;font-size:12px;padding:1px 9px;font-weight:700;
}
.pos-btn.primary .badge{background:#fff;color:var(--brand)}

.sales-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sales-head h2{margin:0;font-size:19px}
.sales-head .btn{margin-left:auto}

/* 銷售單卡片列表 */
.rec-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  margin-bottom:12px;padding:14px 16px}
/* 今日銷售：逐筆列表 */
.day-sum{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;background:#fff;
  border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;border-bottom:0;padding:12px 16px}
.day-sum .n{font-weight:700;font-size:16px}
.day-sum .amt{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;color:var(--brand)}
.day-sum .by{font-size:12px;color:var(--ink-3);margin-left:auto}
/* 日結之後營業日跟日曆日不一樣時，把日期標出來 */
.day-sum .dn{font-size:11.5px;color:var(--brand);background:var(--brand-soft);
  border-radius:5px;padding:1px 7px;font-variant-numeric:tabular-nums}
.day-list{background:#fff;border:1px solid var(--line);border-radius:0 0 var(--r) var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.day-row{display:grid;gap:2px 10px;padding:11px 16px;border-top:1px solid var(--line);
  grid-template-columns:auto auto 1fr auto;align-items:baseline}
.day-row .tm{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.day-row .kd{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.day-row .k-shop{background:var(--brand-soft);color:var(--brand)}
.day-row .k-online{background:#e6f7f3;color:#0f766e}
.day-row .k-mini{background:var(--violet-soft);color:var(--violet)}
.day-row .k-dist{background:var(--warn-soft);color:var(--warn)}
.day-row .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.day-row .mn{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.day-row .it{grid-column:3/-1;font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.day-row .st{grid-column:3/-1;font-size:12px;color:var(--ink-3);display:flex;gap:7px;align-items:center}
.day-row .void-tag{font-style:normal;font-size:11px;background:#f1f5f9;color:var(--ink-3);
  border-radius:4px;padding:1px 6px;margin-left:6px}
.day-row.is-void{opacity:.55}
.day-row.is-void .mn{text-decoration:line-through}
@media(max-width:430px){.day-row{grid-template-columns:auto 1fr auto}.day-row .tm{grid-column:1}}

/* 金額旁邊的收款方式（出納對帳用） */
.rec-top .amt .pw{
  display:inline-block;font-style:normal;font-size:11px;font-weight:700;
  border-radius:5px;padding:1px 7px;margin-left:7px;vertical-align:2px;
}
.rec-top .amt .pw.cash{background:var(--ok-soft);color:var(--ok)}
.rec-top .amt .pw.bank{background:var(--violet-soft);color:var(--violet)}

/* 本日營業結束：每間門市一張小卡 */
.day-panel{display:grid;gap:10px;margin-bottom:12px;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.dp-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:12px 14px;border-top:3px solid var(--brand)}
.dp-card.closed{border-top-color:var(--ok);background:#fbfefc}
.dp-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dp-top .nm{font-weight:700;font-size:15px}
.dp-top .dy{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.dp-top .dy i{font-style:normal;color:var(--ok)}
.dp-num{display:flex;align-items:baseline;gap:9px;margin-top:4px}
.dp-num b{font-size:22px;color:var(--brand);font-variant-numeric:tabular-nums}
.dp-num span{font-size:12px;color:var(--ink-3)}
.dp-split{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:5px;font-size:12.5px;color:var(--ink-2)}
.dp-split b{font-variant-numeric:tabular-nums;color:var(--ink)}
.dp-split .v{color:var(--ink-3)}
.dp-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.dp-foot .ok{font-size:12px;color:var(--ok);font-weight:500;margin-right:auto}
.dp-foot .btn{margin-left:auto}
.dp-foot .ok+.btn{margin-left:0}

/* 每天之間的分隔線 */
.day-div{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.day-div .dd-date{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.day-div .dd-sum{display:flex;flex-wrap:wrap;gap:4px 12px;margin-left:auto;
  font-size:12px;color:var(--ink-3)}
.day-div .ds b{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.day-div .ds i{font-style:normal;margin-left:3px}
.day-div .ds em{font-style:normal;margin-left:5px;color:var(--ok);font-weight:700}

/* 來店銷售：近七天業績 */
.perf{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:12px 16px;margin-bottom:12px}
.perf-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.perf-top .lb{font-size:13px;color:var(--ink-2);font-weight:600}
.perf-top .lb i{font-style:normal;font-size:11.5px;color:var(--ink-3);margin-left:6px;
  font-variant-numeric:tabular-nums}
.perf-top .n{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.perf-top .amt{margin-left:auto;font-weight:700;font-size:19px;color:var(--brand);
  font-variant-numeric:tabular-nums}
.perf-row{display:flex;gap:8px;align-items:baseline;margin-top:7px;padding-top:7px;
  border-top:1px dashed var(--line)}
.perf-row .pk{flex:0 0 34px;font-size:12px;color:var(--ink-3)}
.perf-row .pv{flex:1;display:flex;flex-wrap:wrap;gap:4px 14px;min-width:0}
.perf-row .pv i{font-style:normal;font-size:12.5px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.perf-row .pv i b{font-weight:600;color:var(--ink);margin-right:3px}
.perf-row .pv i.wrap{white-space:normal;line-height:1.6}

/* 品項健檢的卡片：有問題要跳出來，不是變灰 */
.rec-card.chk-bad{border-left:4px solid var(--bad);background:#fffbfb}
.rec-card.chk-warn{border-left:4px solid var(--warn);background:#fffdf7}
.rec-card.chk-bad .rec-items,.rec-card.chk-warn .rec-items{font-weight:500}

/* 應收待結：第一層彙整卡 */
.sum-card{display:grid;grid-template-columns:1fr auto;gap:3px 12px;width:100%;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  margin-bottom:10px;padding:14px 16px;cursor:pointer;font:inherit;color:inherit;transition:.15s}
.sum-card:hover{border-color:var(--brand);background:#fcfdff}
.sum-card .who3{font-weight:700;font-size:16px}
.sum-card .owe{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;color:var(--bad);white-space:nowrap}
.sum-card .sub2{grid-column:1/-1;font-size:12.5px;color:var(--ink-3);
  display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.sum-card .go{font-style:normal;font-size:12.5px;color:var(--brand);white-space:nowrap;margin-left:auto}
.recv-total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  background:var(--bad-soft);border:1px solid #fecaca;border-radius:var(--r);
  padding:12px 16px;margin-bottom:14px}
.recv-total b{font-size:18px;font-variant-numeric:tabular-nums;color:var(--bad)}

/* 三選一的選項組（網路單的庫存處理） */
.opt-list{display:grid;gap:8px}
.opt-list .opt{
  display:grid;grid-template-columns:20px 1fr;align-items:start;column-gap:11px;
  border:1px solid var(--line);border-radius:10px;background:#fff;
  padding:12px 14px;cursor:pointer;font-size:14px;line-height:1.55;transition:.15s;
}
.opt-list .opt:hover{background:#f8fafc}
.opt-list .opt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.opt-list .opt input{
  width:18px;height:18px;min-height:0;margin:0;accent-color:var(--brand);
  justify-self:center;align-self:start;margin-top:1px;
}
.opt-list .opt span{min-width:0;overflow-wrap:anywhere}
.opt-warn{
  margin-top:10px;background:var(--warn-soft);border:1px solid #fcd34d;
  border-left:4px solid var(--warn);color:#92400e;
  border-radius:10px;padding:11px 14px;font-size:14px;line-height:1.6;
}

/* 撿貨卡（網路應收待結） */
.pick-sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
  background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 14px;
  margin-bottom:12px;font-size:13px;color:var(--ink-2)}
.pick-sum b{font-size:15px;color:var(--bad);font-variant-numeric:tabular-nums}
.pick-sum b.warn{color:var(--warn);font-size:13px}

/* ---------- 網路應收待結：階段篩選 ---------- */
.stage-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.stage-bar .stg{border:1.5px solid var(--line);background:#fff;border-radius:11px;
  padding:9px 11px;cursor:pointer;text-align:left;font:inherit;color:var(--ink-2);
  display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;line-height:1.25;font-weight:700;font-size:13.5px}
.stage-bar .stg i{font-style:normal;font-weight:800;font-size:15px;color:var(--brand);
  margin-left:auto;font-variant-numeric:tabular-nums}
.stage-bar .stg em{flex:1 1 100%;font-style:normal;font-weight:400;font-size:11px;color:var(--ink-3)}
.stage-bar .stg.zero{opacity:.5}
.stage-bar .stg.zero i{color:var(--ink-3)}
.stage-bar .stg.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.stage-note{font-size:12.5px;color:var(--ink-3);margin:-4px 0 10px 2px}

/* ---------- 網路單四關進度 ---------- */
.flow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:10px;
  padding:7px 10px;border-radius:9px;background:#f8fafc;border:1px solid var(--line)}
.flow .fs{font-size:12px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.flow .fs.ok{color:var(--ok,#059669)}
.flow i{font-style:normal;color:var(--ink-3);opacity:.5;font-size:12px}
.acct-ready{margin-top:8px;padding:8px 11px;border-radius:9px;background:#ecfdf5;
  border:1px solid #a7f3d0;color:#047857;font-size:12.5px;font-weight:700}

/* ---------- 品項性質（保固換貨／點數換贈／公關贈品） ---------- */
.gift-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;
  padding:7px 10px;border-radius:9px;background:#f8fafc;border:1px dashed var(--line)}
.gift-row .gl{font-size:12.5px;font-weight:700;color:var(--ink-3);flex:0 0 auto}
.gift-row select{flex:1 1 140px;min-width:0}
.gift-row .gt{flex:1 1 100%;font-style:normal;font-size:11.5px;color:#9a3412}
.gift-row.on{background:#fff7ed;border-color:#fed7aa;border-style:solid}

/* ---------- 網路單收款方式徽章 ---------- */
.pill-col{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill-col.prepaid{background:#ecfdf5;color:#047857}
.pill-col.cod{background:#eff6ff;color:#1d4ed8}

/* ---------- 待會計確認小計 ---------- */
.acct-sum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px;
  padding:10px 14px;border-radius:11px;background:#ecfdf5;border:1px solid #a7f3d0}
.acct-sum .lb{font-size:13px;font-weight:700;color:#047857;line-height:1.3}
.acct-sum .lb i{display:block;font-style:normal;font-weight:400;font-size:11px;color:#059669}
.acct-sum .n{margin-left:auto;font-size:12.5px;color:#047857}
.acct-sum .amt{font-size:17px;font-weight:800;color:#047857;font-variant-numeric:tabular-nums}
.stage-bar .stg b.sm{flex:1 1 100%;font-size:11.5px;font-weight:700;color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.stage-bar .stg.on b.sm{color:var(--brand)}
.rec-card.pick{padding:12px 14px}
.pick-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.pick-head .nm{font-weight:700;font-size:16px;flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.pick-head .amt{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pick-head .amt i{font-style:normal;font-size:11px;font-weight:400;color:var(--ink-3);margin-left:4px}
.pick-sub{font-size:11.5px;color:var(--ink-3);margin-bottom:9px;overflow-wrap:anywhere}
.pick-items{background:#f8fafc;border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;margin-bottom:9px;white-space:pre-wrap;
  font-size:15.5px;font-weight:500;line-height:1.65;overflow-wrap:anywhere}
.pick-flag{background:var(--bad-soft);border:1px solid #fecaca;color:#991b1b;border-radius:8px;
  padding:7px 11px;font-size:13px;font-weight:500;margin-bottom:9px}
.pick-note{font-size:12.5px;color:var(--ink-2);margin-bottom:9px;overflow-wrap:anywhere}
.pick-row{display:grid;grid-template-columns:58px 1fr;align-items:center;gap:8px;margin-bottom:7px}
.pick-row .pl{font-size:12px;color:var(--ink-3);white-space:nowrap}
.pick-row .pc{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.pick-in{height:36px!important;padding:6px 10px!important;font-size:14px}
.pchip{border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:8px;
  padding:6px 11px;font-size:13px;cursor:pointer;white-space:nowrap;transition:.12s}
.pchip:hover{background:#f8fafc}
.pchip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
.rec-card.pick .rec-foot{margin:10px -14px -12px;padding:10px 14px;background:#f8fafc;
  border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r);
  display:flex;gap:7px;align-items:center;flex-wrap:wrap}

.rec-card.is-void{opacity:.62;background:#fafafa}
.rec-card.is-void .amt{text-decoration:line-through}
.rec-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.rec-top .who2{font-weight:700;font-size:16px;flex:1 1 auto;min-width:0}
.rec-top .amt{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.rec-meta{font-size:12px;color:var(--ink-3);margin-bottom:10px}
.rec-items{font-size:13.5px;color:var(--ink-2);white-space:pre-wrap;background:#f8fafc;
  border-radius:9px;padding:8px 11px;margin-bottom:10px}
.st-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.st-grid label{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:3px}
.st-grid select,.st-grid input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.rec-foot{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.pill-pay{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.pill-pay.no{background:var(--bad-soft);color:var(--bad)}
.pill-pay.yes{background:var(--ok-soft);color:var(--ok)}

/* 表單：大按鈕風格 */
.big-chips{display:flex;gap:8px;flex-wrap:wrap}
.big-chips .chip{padding:13px 18px;font-size:15px;border-radius:12px}
.sale-form input[type=number]{font-size:17px;padding:13px 12px}
.hint-row{font-size:12.5px;color:var(--ink-3);margin-top:5px}
.check-inline{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;cursor:pointer;background:#fff;font-size:14px}
.check-inline.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:500}
.check-inline input{width:18px;height:18px;accent-color:var(--brand)}

/* ---------- 登入 / 載入 ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate-box{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:34px 28px;max-width:400px;text-align:center}
.gate-box .logo-mark{width:52px;height:52px;font-size:22px;margin:0 auto 16px;border-radius:15px}
.gate-box h1{font-size:20px;margin:0 0 6px}
.gate-box p{color:var(--ink-2);font-size:14px;margin:0 0 22px}
.gate-box .btn{width:100%;justify-content:center;padding:12px}
.err{background:var(--bad-soft);border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:16px;text-align:left;white-space:pre-wrap}
.loading{display:grid;place-items:center;padding:60px 20px;color:var(--ink-3);gap:12px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;
  box-shadow:var(--shadow);max-width:90vw;text-align:center;
}
.toast.bad{background:var(--bad)}
.toast.ok{background:var(--ok)}
#newBtnTop{font-weight:700}
</style>
</head>
<body>
<!-- ══════════════════════════════════════════════════════════════════
     圖示（LOGO）：要換圖案只要改下面這一個 <symbol> 裡面的內容就好，
     頁面上兩個地方（登入畫面、頂端列）都會跟著變。
     另外兩個備用圖案放在最下面，想換就把 d="..." 整段換掉。
     ══════════════════════════════════════════════════════════════════ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="logoMark" viewBox="0 0 24 24">
    <!-- 目前使用：招財貓（舉手招客人） -->
    <path d="M8.5 4.6 L7.5 1.9 L10.4 3.4"/>
    <path d="M15.5 4.6 L16.5 1.9 L13.6 3.4"/>
    <path d="M12 3.2 a4.3 4.3 0 0 0 0 8.6 a4.3 4.3 0 0 0 0-8.6"/>
    <path d="M10.3 7 v.6"/>
    <path d="M13.7 7 v.6"/>
    <path d="M8.4 21 V16.2 a3.6 3.6 0 0 1 7.2 0 V21"/>
    <path d="M15.4 15.4 L17.6 13"/>
    <path d="M18.4 11 a1.5 1.5 0 0 0 0 3 a1.5 1.5 0 0 0 0-3"/>
    <path d="M6.6 21 H17.4"/>
    <!-- 備用 A・貓臉：
         <path d="M6.6 7.4 L5.5 3.4 L9.2 5.5"/><path d="M17.4 7.4 L18.5 3.4 L14.8 5.5"/>
         <path d="M12 5.4 c-4 0-6.9 2.9-6.9 6.6 s2.9 6.6 6.9 6.6 s6.9-2.9 6.9-6.6 s-2.9-6.6-6.9-6.6"/>
         <path d="M9.6 11.4 v.7"/><path d="M14.4 11.4 v.7"/>
         <path d="M10.6 14.3 a1.4 1.4 0 0 0 2.8 0"/>
         <path d="M1.8 11.4 h2.6 M1.8 13.7 h2.4 M19.6 11.4 h2.6 M19.6 13.7 h2.4"/>
    -->
    <!-- 備用 B・雙拱門：
         <path d="M2.5 9 L12 3.2 L21.5 9"/><path d="M4 20 V12.8 a3.2 3.2 0 0 1 6.4 0 V20"/>
         <path d="M13.6 20 V12.8 a3.2 3.2 0 0 1 6.4 0 V20"/><path d="M2 20 H22"/>
    -->
  </symbol>
</svg>


<!-- 登入畫面 -->
<div id="gate" class="gate">
  <div class="gate-box">
    <div class="logo-mark"><svg><use href="#logoMark"/></svg></div>
    <h1>西門龍門儀錶板</h1>
    <p>三重龍門 × 西門　銷售紀錄 / 工作留言板</p>
    <div id="gateErr" class="err hidden"></div>
    <button id="loginBtn" class="btn btn-primary">使用 Google 帳號登入</button>
    <p style="margin:16px 0 0;font-size:12px;color:var(--ink-3)">請使用有「進銷存總表」權限的公司帳號</p>
  </div>
</div>

<!-- 主畫面 -->
<div id="app" class="hidden">
  <header>
    <div class="head-in">
      <div class="logo">
        <div class="logo-mark"><svg><use href="#logoMark"/></svg></div>
        <div>
          <h1>西門龍門儀錶板 <span id="appVer" class="ver"></span></h1>
          <p id="subhead">三重龍門 × 西門</p>
        </div>
      </div>
      <div class="who">
        <img id="uAvatar" class="avatar" alt="">
        <span id="uName"></span>
      </div>
      <button id="refreshBtn" class="btn btn-sm" title="重新整理">↻ 更新</button>
      <button id="logoutBtn" class="btn btn-ghost btn-sm">登出</button>
    </div>
